name: OSV-Scanner Scheduled Scan

on:
  schedule:
    - cron: "0 13 * * 4"
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  actions: read
  security-events: write
  contents: read

jobs:
  scan-scheduled:
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc" # v2.6.0
